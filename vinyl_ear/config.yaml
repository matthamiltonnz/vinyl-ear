name: Vinyl Ear
version: "0.11.2"
slug: vinyl_ear
description: Listens to a microphone or line input, identifies the record that is playing with Shazam, publishes it to Home Assistant over MQTT, and can record a side losslessly for ripping
url: https://github.com/matthamiltonnz/vinyl-ear
arch:
  - amd64
  - aarch64
audio: true
homeassistant_api: true
map:
  - config:rw
  - share:rw
  - media:rw
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:record-player
panel_title: Vinyl Ear
# The radio stream is the one thing that has to be reachable from another add-on, so it gets
# a published port. It serves audio only; the UI stays behind ingress.
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: Live MP3 stream for Music Assistant
options:
  source: ""
  active_entity: ""
  sample_rate: 44100
  listen_seconds: 15
  silence_clear_seconds: 45
  keep_first_album: true
  blank_unknown_track: true
  noise_gate_db: -45
  poll_seconds: 30
  device_name: turntable
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  discovery_prefix: homeassistant
  log_level: info
  stream_enabled: false
  stream_bitrate: 128
  stream_format: mp3
schema:
  source: str?
  active_entity: str?
  sample_rate: list(16000|44100|48000)
  listen_seconds: int(5,30)
  silence_clear_seconds: int(10,900)
  keep_first_album: bool
  blank_unknown_track: bool
  noise_gate_db: float
  poll_seconds: int(5,600)
  device_name: match(^[a-z0-9_]+$)
  mqtt_host: str
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
  discovery_prefix: str
  log_level: list(debug|info|warning|error)
  stream_enabled: bool
  stream_bitrate: list(64|96|128|160|192)
  stream_format: list(mp3|flac)
