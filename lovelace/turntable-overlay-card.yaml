# Full screen camera with the now playing details painted over it (panel view).
#
# The pill is drawn only when there is something to say: artist, track and album are
# painted as one block, and when Shazam has not named anything there is no pill at all
# rather than a line saying so. An unnamed track keeps the artist and sleeve from the
# last answer and simply drops its own line.
#
# Home Assistant serves /local with `Cache-Control: public, max-age=2678400` (31 days),
# 404s included, so a fixed artwork path pins whatever the Cast display first fetched —
# usually a 404 from before the first match, which then never resolves. The add-on
# therefore writes every cover under its own epoch-named file and publishes that path in
# the `artwork` attribute, so each new cover is a URL no client has ever seen. Paint it
# twice: `::before` as a background image, and the pill's own background image, because a
# pseudo-element's `content: url()` and a background image are not equally reliable on a
# cast receiver.
type: panel
title: Turntable
path: turntable
cards:
  - type: custom:webrtc-camera
    url: Turntable
    card_mod:
      style: |
        {%- set s = 'sensor.vinyl_ear_turntable_now_playing' -%}
        {%- set artist = state_attr(s, 'artist') -%}
        {%- set title = state_attr(s, 'title') -%}
        {%- set album = state_attr(s, 'album') -%}
        {%- set year = state_attr(s, 'year') -%}
        {%- set art = state_attr(s, 'artwork') -%}
        {%- set lines = [] -%}
        {%- if artist %}{% set lines = lines + [artist] %}{% endif -%}
        {%- if title %}{% set lines = lines + [title] %}{% endif -%}
        {%- if album %}{% set lines = lines + [album ~ (' (' ~ year ~ ')' if year else '')] %}{% endif -%}
        {%- if lines %}
        {%- if art %}
        ha-card::before {
          content: "";
          position: absolute;
          top: calc(3.5% + 18px);
          left: calc(2.5% + 22px);
          width: 88px;
          height: 88px;
          background-image: url('{{ art }}');
          background-position: center;
          background-size: cover;
          border-radius: 12px;
          z-index: 4;
          pointer-events: none;
        }
        {%- endif %}
        ha-card::after {
          content: "{{ lines | join('\\00000A') }}";
          position: absolute;
          display: block;
          top: 3.5%;
          left: 2.5%;
          max-width: 62%;
          padding: 18px 26px 18px {{ '132px' if art else '26px' }};
          border-radius: 20px;
          background-color: rgba(8, 10, 16, 0.66);
          {%- if art %}
          background-image: url('{{ art }}');
          background-position: 22px center;
          background-size: 88px 88px;
          background-repeat: no-repeat;
          {%- endif %}
          min-height: 88px;
          color: #ffffff;
          font-size: 1.45rem;
          font-weight: 600;
          line-height: 1.42;
          white-space: pre-line;
          box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
          text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
          z-index: 3;
          pointer-events: none;
        }
        {%- else %}
        ha-card::before,
        ha-card::after {
          content: none;
        }
        {%- endif %}
