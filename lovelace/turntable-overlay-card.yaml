# Full screen camera with the now playing details painted over it (panel view).
#
# Home Assistant serves /local with `Cache-Control: public, max-age=2678400` (31 days),
# 404s included, so a fixed artwork path pins whatever the Cast display first fetched —
# usually a 404 from before the first match, which then never resolves. Use the
# epoch-tagged `artwork` attribute instead: every new cover is a new URL, so the browser
# has to fetch it, and the pill text updates on the same render.
type: panel
title: Turntable
path: turntable
cards:
  - type: custom:webrtc-camera
    url: Turntable
    card_mod:
      style: |
        {%- set s = 'sensor.vinyl_ear_turntable_now_playing' -%}
        {%- set artist = state_attr(s, 'artist') -%}
        {%- set title = state_attr(s, 'title') -%}
        {%- set album = state_attr(s, 'album') -%}
        {%- set year = state_attr(s, 'year') -%}
        {%- set art = state_attr(s, 'artwork') -%}
        {%- if is_state(s, 'unavailable') or is_state(s, 'unknown') -%}
        {%- set lines = 'Vinyl Ear is offline — is the add-on running?' -%}
        {%- elif artist or title or album -%}
        {%- set lines = artist ~ '\\00000A' ~ (title or 'track not identified') ~ ('\\00000A' ~ album ~ (' · ' ~ year if year else '') if album else '') -%}
        {%- else -%}
        {%- set lines = 'Nothing playing — drop the needle' -%}
        {%- endif -%}
        {%- if art %}
        ha-card::before {
          content: url('{{ art }}');
          position: absolute;
          top: calc(3.5% + 18px);
          left: calc(2.5% + 22px);
          width: 88px;
          height: 88px;
          object-fit: cover;
          border-radius: 12px;
          z-index: 4;
          pointer-events: none;
        }
        {%- endif %}
        ha-card::after {
          content: "{{ lines }}";
          position: absolute;
          display: block;
          top: 3.5%;
          left: 2.5%;
          max-width: 62%;
          padding: 18px 26px 18px 132px;
          border-radius: 20px;
          background-color: rgba(8, 10, 16, 0.66);
          {%- if art %}
          background-image: url('{{ art }}');
          {%- else %}
          background-image: url('/local/vinyl-art/turntable.jpg');
          {%- endif %}
          background-position: 22px center;
          background-size: 88px 88px;
          background-repeat: no-repeat;
          min-height: 88px;
          color: #ffffff;
          font-size: 1.45rem;
          font-weight: 600;
          line-height: 1.42;
          white-space: pre-line;
          box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
          text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55);
          z-index: 3;
          pointer-events: none;
        }
