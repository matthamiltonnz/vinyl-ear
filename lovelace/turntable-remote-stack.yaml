# One conditional card for the Lounge Remote stack: artwork beside the live camera,
# with the track details on a full width card underneath so the title has room.
# Replaces the separate webrtc-camera and type: entity conditionals.
type: conditional
conditions:
  - condition: state
    entity: input_boolean.activity_turntable
    state: "on"
card:
  type: vertical-stack
  cards:
    - type: horizontal-stack
      card_mod:
        style: |
          #root > *:nth-child(1) { flex: 0 0 32% !important; }
          #root > *:nth-child(2) { flex: 1 1 68% !important; }
      cards:
        - type: markdown
          content: >-
            {%- set art = state_attr('sensor.vinyl_ear_turntable_now_playing', 'artwork') -%}
            {%- if art -%}
            <img src="{{ art }}" style="display:block;width:100%;border-radius:10px">
            {%- else -%}
            <div style="display:flex;align-items:center;justify-content:center;height:72px;font-size:1.6rem;opacity:0.3">♫</div>
            {%- endif -%}
        - type: custom:webrtc-camera
          url: Turntable
    - type: markdown
      content: >-
        {%- set s = 'sensor.vinyl_ear_turntable_now_playing' -%}
        {%- set artist = state_attr(s, 'artist') -%}
        {%- set title = state_attr(s, 'title') -%}
        {%- set album = state_attr(s, 'album') -%}
        {%- set year = state_attr(s, 'year') -%}
        {%- if is_state(s, 'unavailable') or is_state(s, 'unknown') -%}
        <div style="font-size:0.95rem;opacity:0.6">Vinyl Ear is offline — is the add-on running?</div>
        {%- elif artist and title -%}
        <div style="font-size:1.05rem;font-weight:600;line-height:1.3">{{ artist }} — {{ title }}</div>
        {%- if album -%}
        <div style="font-size:0.85rem;opacity:0.65;margin-top:2px">{{ album }}{% if year %} · {{ year }}{% endif %}</div>
        {%- endif -%}
        {%- else -%}
        <div style="font-size:0.95rem;opacity:0.6">Nothing playing — drop the needle.</div>
        {%- endif -%}
