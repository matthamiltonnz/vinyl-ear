# One conditional card for the Lounge Remote stack: track details on a full width card,
# then the album artwork beside a square (centre-cropped) view of the turntable camera.
# Replace "turntable" below with your device_name if you changed it.
#
# Neither card is shown when there is nothing to say: no "Nothing playing" line and no
# "track not identified" placeholder, just the camera. An album that Shazam has named but
# a track it has not shows the artist and sleeve with no title line.
type: conditional
conditions:
  - condition: state
    entity: input_boolean.activity_turntable
    state: "on"
card:
  type: vertical-stack
  cards:
    - type: markdown
      content: >-
        {%- set s = 'sensor.vinyl_ear_turntable_now_playing' -%}
        {%- set artist = state_attr(s, 'artist') -%}
        {%- set title = state_attr(s, 'title') -%}
        {%- set album = state_attr(s, 'album') -%}
        {%- set year = state_attr(s, 'year') -%}
        {%- set parts = [] -%}
        {%- if artist %}{% set parts = parts + [artist] %}{% endif -%}
        {%- if title %}{% set parts = parts + [title] %}{% endif -%}
        {%- if is_state(s, 'unavailable') or is_state(s, 'unknown') -%}
        <div style="font-size:0.95rem;opacity:0.6">Vinyl Ear is offline — is the add-on running?</div>
        {%- elif parts -%}
        <div style="font-size:1.05rem;font-weight:600;line-height:1.3">{{ parts | join(' — ') }}</div>
        {%- if album -%}
        <div style="font-size:0.85rem;opacity:0.65;margin-top:2px">{{ album }}{% if year %} · {{ year }}{% endif %}</div>
        {%- endif -%}
        {%- endif -%}
      card_mod:
        style: |
          {%- set s = 'sensor.vinyl_ear_turntable_now_playing' -%}
          {%- set named = state_attr(s, 'artist') or state_attr(s, 'album') or state_attr(s, 'title') -%}
          {%- set offline = is_state(s, 'unavailable') or is_state(s, 'unknown') -%}
          {%- if not (named or offline) %}
          ha-card { display: none !important; }
          {%- endif %}
    - type: horizontal-stack
      cards:
        - type: markdown
          content: >-
            {%- set art = state_attr('sensor.vinyl_ear_turntable_now_playing', 'artwork') -%}
            {%- if art -%}
            <img src="{{ art }}" style="display:block;width:100%;height:auto;border-radius:10px">
            {%- endif -%}
          card_mod:
            style: |
              {%- if not state_attr('sensor.vinyl_ear_turntable_now_playing', 'artwork') %}
              ha-card { display: none !important; }
              {%- endif %}
        - type: custom:webrtc-camera
          url: Turntable
          style: "video { object-fit: cover; }"
          card_mod:
            style: |
              ha-card {
                aspect-ratio: 1 / 1;
                height: auto !important;
              }
