# One conditional card for the Lounge Remote stack: track details beside the live
# camera feed, so the pair occupies a single row on a phone screen.
# Replaces the separate webrtc-camera and type: entity conditionals.
type: conditional
conditions:
  - condition: state
    entity: input_boolean.activity_turntable
    state: "on"
card:
  type: horizontal-stack
  cards:
    - type: markdown
      content: >-
        {%- set s = 'sensor.vinyl_ear_turntable_now_playing' -%}
        {%- set art = state_attr(s, 'artwork') -%}
        {%- set artist = state_attr(s, 'artist') -%}
        {%- set title = state_attr(s, 'title') -%}
        {%- set album = state_attr(s, 'album') -%}
        {%- set year = state_attr(s, 'year') -%}
        {%- if is_state(s, 'unavailable') or is_state(s, 'unknown') -%}
        <div style="font-size:0.85rem;opacity:0.6">Vinyl Ear is offline</div>
        {%- elif artist and title -%}
        {% if art -%}
        <img src="{{ art }}" width="56" height="56" style="float:left;margin:0 10px 4px 0;border-radius:8px">
        {%- endif -%}
        <div style="font-size:0.95rem;font-weight:600;line-height:1.3">{{ artist }} — {{ title }}</div>
        {%- if album -%}
        <div style="font-size:0.8rem;opacity:0.65;margin-top:2px">{{ album }}{% if year %} · {{ year }}{% endif %}</div>
        {%- endif -%}
        <div style="clear:both"></div>
        {%- else -%}
        <div style="font-size:0.85rem;opacity:0.6">Nothing playing</div>
        {%- endif -%}
    - type: custom:webrtc-camera
      url: Turntable
